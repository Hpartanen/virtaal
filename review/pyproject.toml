[project]
name = "virtaal-review"
version = "0.1.0"
description = "A small review window for XLIFF 1.2 on Virtaal's core, in Python and Tkinter only."
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "translate-toolkit==3.20.0",
    "lxml==6.1.3",
]

[project.scripts]
virtaal-review = "virtaal_review.app:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["virtaal_review*"]
